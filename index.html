document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"3334b630-8148-4e62-96c8-4382bc7c927a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"bc38f6ba-b82c-419b-974f-0ba733c6e663\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"247bd71f-4096-4d2a-8f6f-8461886b3c3b\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\n@font-face{font-family:'Original Salmon';src:url(\"5de67329-3e0b-41fb-abbe-87db8417979b\") format('opentype');font-weight:400;font-style:normal;font-display:swap}\n[data-theme=\"light\"]{--bg:#F5EEDD;--card:#FFFDF6;--ink:#211C14;--inkSoft:#5C5340;--line:#D8C9A8;--vinho:#E6532F;--periwinkle:#2F4DA6;--berry:#A8386B;--pink:#C13566;--cloud:#F2C94C;--skyblue:#1F8C74;--shadow:rgba(33,28,20,0.16)}\n[data-theme=\"dark\"]{--bg:#181310;--card:#241D16;--ink:#F5EAD9;--inkSoft:#C7B99C;--line:#3C2F21;--vinho:#FF8A66;--periwinkle:#8FA8FF;--berry:#E393BB;--pink:#D65F8C;--cloud:#E8C158;--skyblue:#4FBFA8;--shadow:rgba(0,0,0,0.55)}\nbody{margin:0}\na{color:var(--periwinkle)}\na:hover{color:var(--vinho)}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}\n.paper{width:210mm;min-height:297mm;box-sizing:border-box;padding:16mm 15mm;background:#fff;color:#241c19;font-family:Manrope,sans-serif;position:relative}\n.paper-frame{width:calc(210mm * 0.42);height:calc(297mm * 0.42);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.18);border-radius:3px;background:#fff}\n.paper-frame .paper{transform:scale(0.42);transform-origin:top left}\n@page{size:A4;margin:0}\n@media print{\n.no-print{display:none !important}\n.paper-frame{width:auto !important;height:auto !important;overflow:visible !important;box-shadow:none !important;border-radius:0 !important}\n.paper-frame .paper{transform:none !important}\n.print-sheet{display:none}\n.print-sheet.print-selected{display:block !important;page-break-after:always}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.4px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font-family:Manrope,system-ui,sans-serif;padding-bottom:80px\">\n\n<div class=\"no-print\" style=\"position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--ink);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<sc-for list=\"{{ navItems }}\" as=\"nav\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ nav.onClick }}\" style=\"{{ nav.style }}\">{{ nav.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n<button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:16px;box-shadow:2px 2px 0 var(--line)\">{{ themeIcon }}<\u002Fbutton>\n<sc-if value=\"{{ showLogoutButton }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ onLogout }}\" style=\"background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:700;color:var(--inkSoft)\">Sair<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showLoginGate }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:380px;margin:60px auto;padding:0 20px\">\n<div style=\"position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:32px 24px 26px;box-shadow:6px 6px 0 var(--vinho)\">\n<div aria-hidden=\"true\" style=\"position:absolute;top:-12px;left:28px;width:64px;height:22px;background:var(--periwinkle);border:2px solid var(--ink);border-radius:3px;transform:rotate(-4deg)\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position:absolute;top:-18px;right:20px;width:46px;height:46px;border:2px dashed var(--ink);border-radius:50%;background:var(--cloud);display:flex;align-items:center;justify-content:center;font-size:20px;transform:rotate(8deg)\">🔑<\u002Fdiv>\n<h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--ink);font-size:28px;margin:6px 0 8px;letter-spacing:-0.01em\"><span style=\"background:linear-gradient(180deg,transparent 62%,var(--cloud) 62%)\">Entrar<\u002Fspan><\u002Fh1>\n<p style=\"font-size:13px;color:var(--inkSoft);margin:0 0 22px;font-family:'Manrope',sans-serif;line-height:1.5\">Login restrito à Amanda<br><\u002Fp>\n<label style=\"font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--inkSoft);display:block;margin-bottom:6px;font-family:'Manrope',sans-serif\">E-mail<\u002Flabel>\n<input value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ onLoginEmailChange }}\" type=\"email\" placeholder=\"voce@exemplo.com\" style=\"width:100%;padding:11px 13px;border-radius:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:14px;font-family:'Manrope',sans-serif\">\n<label style=\"font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--inkSoft);display:block;margin-bottom:6px;font-family:'Manrope',sans-serif\">Senha<\u002Flabel>\n<input value=\"{{ loginPassword }}\" sc-camel-on-change=\"{{ onLoginPasswordChange }}\" type=\"password\" placeholder=\"••••••••\" style=\"width:100%;padding:11px 13px;border-radius:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:14px;font-family:'Manrope',sans-serif\">\n<sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#fff;background:var(--vinho);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px;font-family:'Manrope',sans-serif;font-weight:600\">{{ loginError }}<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ onLoginSubmit }}\" style=\"width:100%;background:var(--vinho);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-family:'Manrope',sans-serif\">{{ loginButtonLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"max-width:900px;margin:0 auto;padding:24px 20px\">\n<div style=\"position:relative;margin-bottom:24px;padding-top:6px\">\n<h1 style=\"font-family:'Bricolage Grotesque',sans-serif;margin:0 0 12px;letter-spacing:-0.02em;line-height:0.98\">\n<span style=\"display:block;font-weight:600;color:var(--ink);font-size:clamp(20px,4vw,26px)\">Try again.<\u002Fspan>\n<span style=\"display:inline;font-weight:800;color:var(--ink);font-size:clamp(32px,7.5vw,56px);background:linear-gradient(180deg,transparent 60%,var(--vinho) 60%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 3px\">One day, you'll need the right words.<\u002Fspan>\n<\u002Fh1>\n<p style=\"font-family:'Original Salmon',cursive;font-weight:700;font-size:21px;color:var(--ink);margin:12px 0 0\">Build the sentence. Understand the logic. Speak with confidence.<\u002Fp>\n<\u002Fdiv>\n\n\n<div style=\"background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:20px 24px;margin-bottom:24px;box-shadow:4px 4px 0 var(--line)\">\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:var(--inkSoft)\">Este é o seu painel de estudo. Ele não substitui o curso, ele organiza o que você já viu e testa se realmente colou. Comece por onde parou ou escolha um módulo abaixo.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:4px 4px 0 var(--line)\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px\">\n<h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--ink);font-size:26px;margin:0\">Seu progresso<\u002Fh2>\n<span style=\"font-size:15px;font-weight:700;color:var(--inkSoft)\">{{ masteredCount }} de 8 tópicos dominados<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ topicsView }}\" as=\"t\" hint-placeholder-count=\"8\">\n<button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:2px dashed var(--line);border-left:none;border-right:none;border-bottom:none;background:transparent;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)\">\n<span style=\"font-size:14px\">{{ t.label }}<\u002Fspan>\n<span style=\"font-size:13px;font-weight:700;white-space:nowrap\">{{ t.statusLabel }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:4px 4px 0 var(--line)\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px\">\n<h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--ink);font-size:26px;margin:0\">🔄 Revisões pendentes<\u002Fh2>\n<span style=\"font-size:14px;font-weight:700;color:var(--inkSoft)\">{{ revisionCount }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13px;color:var(--inkSoft)\">Conceitos que erraram duas vezes seguidas ou que você marcou para revisar. Três acertos seguidos tiram o conceito daqui automaticamente.<\u002Fp>\n<sc-if value=\"{{ hasRevisions }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{ revisionsView }}\" as=\"r\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)\">\n<div style=\"font-size:14px\">\n<strong>{{ r.label }}<\u002Fstrong> — precisa revisar ({{ r.count }}x). Última: \"{{ r.given }}\" → certo: \"{{ r.correctAnswer }}\".\n<div style=\"color:var(--inkSoft);font-size:13px;margin-top:2px\">{{ r.explanation }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ r.onDelete }}\" title=\"Remover\" style=\"background:transparent;border:none;color:var(--vinho);font-size:18px;cursor:pointer;flex-shrink:0\">✕<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n<sc-if value=\"{{ confirmClear }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"font-size:13px\">Limpar todo o histórico de revisões?<\u002Fspan>\n<button sc-camel-on-click=\"{{ onConfirmClear }}\" style=\"background:var(--vinho);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px\">Sim, limpar<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onCancelClear }}\" style=\"background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px\">Cancelar<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ notConfirmClear }}\" hint-placeholder-val=\"{{ true }}\">\n<button sc-camel-on-click=\"{{ onAskClear }}\" style=\"background:transparent;border:1px solid var(--vinho);color:var(--vinho);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px\">🗑️ Limpar histórico de revisões<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noRevisions }}\" hint-placeholder-val=\"{{ true }}\"><div styl v style=\"margin-top:6px;font-size:13px;font-weight:700;color:#3F8F5F\">✅ Isso mesmo.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ w.exercise.incorrect }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:6px;font-size:13px;font-weight:700;color:var(--vinho)\">Resposta esperada: {{ w.exercise.correctAnswer }}<\u002Fdiv>\n<sc-if value=\"{{ w.exercise.needsChoice }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:12px;margin-top:6px\">Foi distração ou precisa revisar?<\u002Fdiv>\n<div style=\"display:flex;gap:6px;margin-top:4px\">\n<button sc-camel-on-click=\"{{ w.exercise.onDistraction }}\" style=\"background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer\">Distração<\u002Fbutton>\n<button sc-camel-on-click=\"{{ w.exercise.onNeedsReview }}\" style=\"background:var(--vinho);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer\">Revisar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ w.exercise.autoLogged }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:var(--inkSoft);margin-top:6px\">Errou de novo — adicionado às revisões.<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInterviews }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:820px;margin:0 auto;padding:24px 20px\">\n<div style=\"display:inline-flex;align-items:center;background:var(--skyblue);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 13px;font-family:'Manrope',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;box-shadow:2px 2px 0 var(--ink)\">Módulo 06 · Aplicação<\u002Fdiv>\n<h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--ink);font-size:36px;margin:0 0 8px;letter-spacing:-0.01em\">🎯 English for Interviews<\u002Fh1>\n<p style=\"font-size:15px;color:var(--inkSoft);line-height:1.6;margin:0 0 24px\">Dados profissionais revisados — nada de números ou empresas sem confirmação. Preencha os campos [EDITÁVEL] com o que for real.<\u002Fp>\n\n<sc-for list=\"{{ interviewsView }}\" as=\"b\" hint-placeholder-count=\"10\">\n<div style=\"background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:4px 4px 0 var(--line)\">\n<div style=\"font-weight:700;font-size:17px;color:var(--vinho);margin-bottom:10px\">{{ b.id }}. {{ b.title }}<\u002Fdiv>\n<div style=\"font-size:13px;color:var(--inkSoft);margin-bottom:8px\"><strong style=\"color:var(--ink)\">A2:<\u002Fstrong> {{ b.a2 }}<\u002Fdiv>\n<div style=\"font-size:14px;margin-bottom:6px\"><strong>Natural:<\u002Fstrong> {{ b.natural }}<\u002Fdiv>\n<sc-if value=\"{{ b.tag }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:var(--berry);margin-bottom:10px\">{{ b.tag }}<\u002Fdiv><\u002Fsc-if>\n<div style=\"font-size:14px;color:var(--inkSoft);font-family:'Original Salmon',cursive;font-weight:600;margin-bottom:10px\">Estrutura: {{ b.structure }}<\u002Fdiv>\n<sc-if value=\"{{ b.fillField }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom:10px\">\n<label style=\"font-size:12px;font-weight:700;color:var(--inkSoft)\">{{ b.fillField }}<\u002Flabel>\n<input placeholder=\"preencha aqui\" style=\"width:100%;margin-top:4px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px\">\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px\">\n<sc-for list=\"{{ b.keywordsView }}\" as=\"kw\" hint-placeholder-count=\"3\">\n<span style=\"background:var(--cloud);color:#1a1a1a;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600\">{{ kw }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-bottom:12px\">\n<button sc-camel-on-click=\"{{ b.onPlay }}\" style=\"{{ styleAudioBtnSm }}\">🔊 Ouvir<\u002Fbutton>\n<button sc-camel-on-click=\"{{ b.onCopy }}\" style=\"{{ styleAudioBtnSm }}\">{{ b.copyLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<label style=\"font-size:12px;font-weight:700;color:var(--inkSoft);display:block;margin-bottom:6px\">Minha versão<\u002Flabel>\n<textarea value=\"{{ b.myAnswer }}\" sc-camel-on-change=\"{{ b.onMyAnswerChange }}\" placeholder=\"Escreva sua própria versão aqui...\" style=\"width:100%;min-height:60px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPrintables }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"no-print\" style=\"max-width:1000px;margin:0 auto;padding:24px 20px 0\">\n<div style=\"display:inline-flex;align-items:center;background:var(--periwinkle);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 13px;font-family:'Manrope',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;box-shadow:2px 2px 0 var(--ink)\">Módulo 07 · Material<\u002Fdiv>\n<h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;color:var(--ink);font-size:36px;margin:0 0 8px;letter-spacing:-0.01em\">🖨️ Printables<\u002Fh1>\n<p style=\"font-size:15px;color:var(--inkSoft);line-height:1.6;margin:0 0 20px\">Marque as folhas que quer imprimir. A prévia abaixo já é o resultado impresso, em A4 — folhas de consulta rápida, de prática (para preencher à mão) e uma folha de respostas separada.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1000px;margin:0 auto;padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 20px\">\n<sc-for list=\"{{ printablesView }}\" as=\"p\" hint-placeholder-count=\"14\">\n<div>\n<label class=\"no-print\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px\">\n<input type=\"checkbox\" checked=\"{{ p.checked }}\" sc-camel-on-change=\"{{ p.onToggle }}\">\n<span style=\"font-weight:800;color:var(--vinho);font-size:14px\">{{ p.title }}<\u002Fspan>\n<span style=\"font-size:10px;padding:2px 8px;border-radius:999px;background:var(--cloud);color:#1a1a1a;font-weight:700;border:1.5px solid var(--ink)\">{{ p.kindLabel }}<\u002Fspan>\n<\u002Flabel>\n<div class=\"paper-frame\">\n<div class=\"paper print-sheet {{ p.printClass }}\">\n<div style=\"font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:#999;margin-bottom:4px\">English Toolkit — Amanda<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;margin-bottom:2px;color:{{ p.accentVar }}\">{{ p.title }}<\u002Fdiv>\n<sc-if value=\"{{ p.subtitle }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#666;margin-bottom:8mm\">{{ p.subtitle }}<\u002Fdiv><\u002Fsc-if>\n\n<sc-for list=\"{{ p.blocksView }}\" as=\"block\" hint-placeholder-count=\"2\">\n<sc-if value=\"{{ block.isRows }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom:9mm\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;color:{{ p.accentVar }}\">{{ block.heading }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"1\">\n<div style=\"display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:0.75pt solid #ddd;font-size:13px\">\n<span>{{ row.label }}<\u002Fspan>\n<span style=\"font-weight:700;font-style:italic;white-space:nowrap\">{{ row.example }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isFlow }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8mm 0\">\n<sc-for list=\"{{ block.stepsView }}\" as=\"st\" hint-placeholder-count=\"3\">\n<span style=\"border:1px solid {{ p.accentVar }};color:{{ p.accentVar }};border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700\">{{ st.text }}<\u002Fspan>\n<sc-if value=\"{{ st.hasArrow }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#999\">→<\u002Fspan><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isColumns }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin:8mm 0\">\n<div>\n<div style=\"font-weight:800;font-size:13px;margin-bottom:3px;color:{{ p.accentVar }}\">{{ block.left.title }}<\u002Fdiv>\n<div style=\"font-size:11px;font-style:italic;color:#666;margin-bottom:6px\">{{ block.left.note }}<\u002Fdiv>\n<sc-for list=\"{{ block.left.rows }}\" as=\"lr\" hint-placeholder-count=\"3\">\n<div style=\"font-size:12.5px;padding:3px 0\"><strong>{{ lr.tag }}:<\u002Fstrong> {{ lr.text }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"border-left:1px solid #ddd;padding-left:10mm\">\n<div style=\"font-weight:800;font-size:13px;margin-bottom:3px;color:{{ p.accentVar }}\">{{ block.right.title }}<\u002Fdiv>\n<div style=\"font-size:11px;font-style:italic;color:#666;margin-bottom:6px\">{{ block.right.note }}<\u002Fdiv>\n<sc-for list=\"{{ block.right.rows }}\" as=\"rr\" hint-placeholder-count=\"3\">\n<div style=\"font-size:12.5px;padding:3px 0\"><strong>{{ rr.tag }}:<\u002Fstrong> {{ rr.text }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isItems }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8mm 10mm;margin:8mm 0\">\n<sc-for list=\"{{ block.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font-size:13px;margin-bottom:4px\"><strong>{{ it.n }}.<\u002Fstrong> {{ it.prompt }}<\u002Fdiv>\n<div style=\"border-bottom:1px solid #999;height:5mm\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isGrid }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin:6mm 0\">\n<sc-for list=\"{{ whWordsForPrint }}\" as=\"pw\" hint-placeholder-count=\"8\">\n<div style=\"border:1px solid #ccc;border-radius:6px;padding:6px 9px\">\n<strong>{{ pw.word }}<\u002Fstrong> — {{ pw.busca }}<br>\n<span style=\"font-style:italic;font-size:11.5px\">\"{{ pw.example }}\"<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isAnswerGroups }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-for list=\"{{ block.groups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n<div style=\"margin-bottom:8mm\">\n<div style=\"font-weight:800;font-size:13px;margin-bottom:4px;color:{{ p.accentVar }}\">{{ grp.sheet }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:4px\">\n<sc-for list=\"{{ grp.answers }}\" as=\"ans\" hint-placeholder-count=\"8\">\n<div style=\"font-size:12.5px\">{{ ans }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-if>\n<sc-if value=\"{{ block.isNote }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1.5px solid {{ p.accentVar }};border-radius:8px;padding:8px 12px;font-size:12.5px;margin:8mm 0;color:#333\">{{ block.text }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n\n<div style=\"position:absolute;bottom:8mm;right:15mm;font-size:9px;color:#aaa\">english.amandafranco.com.br<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div class=\"no-print\" style=\"max-width:1000px;margin:0 auto;padding:0 20px 24px\">\n<sc-if value=\"{{ printWarning }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--vinho);font-size:13px;font-weight:700;margin-bottom:10px\">Selecione pelo menos uma folha.<\u002Fdiv><\u002Fsc-if>\n<button sc-camel-on-click=\"{{ doPrint }}\" style=\"background:var(--vinho);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-family:'Manrope',sans-serif\">Imprimir selecionadas<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ speechUnsupported }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"no-print\" style=\"position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--vinho);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 4px 16px var(--shadow)\">Seu navegador não suporta leitura de voz — funciona melhor no Chrome ou Edge.<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SUBJECTS = ['i','you','he','she','we','they'];\nconst PRONOUNS = {i:'I',you:'You',he:'He',she:'She',we:'We',they:'They'};\nconst AUX_CONCEPT = {A:'dodoesdid', B:'tobe', C:'modais', D:'have'};\n\nclass Component extends DCLogic {\n  state = {\n    theme:'light', view:'home', data:null,\n    duvidasUI:{}, understood:{}, myExplanations:{},\n    labUI:{}, auxUI:{}, fundamentosExpand:{},\n    interviewAnswers:{},\n    printSelected:['f1','f2','f3','f4'], printWarning:false,\n    lastSection:null,\n    repeatFlow:null, recordings:{}, listeningRevealed:{},\n    speechUnsupported:false,\n    exerciseInputs:{}, exerciseChecked:{}, pendingReview:{},\n    topicActivity:{}, streaks:{correct:{}, wrong:{}}, revisions:{},\n    confirmClearRevisions:false,\n    audioManifest:[],\n    supabaseConfigured:false, authUser:null, authOptimistic:false, showLoginGate:false,\n    loginEmail:'', loginPassword:'', loginError:null, loginLoading:false\n  };\n\n  componentDidMount(){\n    Promise.all([import(window.__resources.contentDataJs), import(window.__resources.storeJs), import(window.__resources.supabaseClientJs)])\n      .then(([contentMod, storeMod, supaMod])=>{\n        this.storage = storeMod.Store;\n        this.sync = storeMod.Sync;\n        this.supaMod = supaMod;\n        this.migrateLegacy();\n        this.loadPersisted();\n        this.setState({data:contentMod});\n        this.loadAudioManifest(contentMod);\n        this.initAuth(supaMod, contentMod);\n      })\n      .catch((e)=>console.error('Toolkit assets failed to load', e));\n  }\n\n  // Local-first: se Supabase não está configurado (placeholders no supabase-client.js),\n  // o app nunca mostra tela de login — funciona 100% local, como antes da Fase 2.\n  // Se configurado, checa uma sessão em cache de forma SÍNCRONA (sem esperar rede) para\n  // abrir o conteúdo instantaneamente, e confirma a sessão em segundo plano depois.\n  initAuth(supaMod, contentMod){\n    const configured = supaMod.SUPABASE_CONFIGURED;\n    this.setState({supabaseConfigured: configured});\n    if(!configured) return;\n    const client = supaMod.getSupabaseClient();\n    if(!client){ this.setState({showLoginGate:true}); return; }\n    this.supaClient = client;\n    const optimistic = supaMod.hasLikelyCachedSession();\n    this.setState({authOptimistic: optimistic, showLoginGate: !optimistic});\n    client.auth.getSession().then(({data})=>{\n      const user = data && data.session && data.session.user;\n      if(user){\n        this.setState({authUser:user, showLoginGate:false, authOptimistic:false});\n        this.sync.configure(client, user.id);\n        this.sync.reconcileAll(contentMod).then(()=>this.loadPersisted());\n      } else {\n        this.setState({authUser:null, showLoginGate:true, authOptimistic:false});\n      }\n    }).catch(()=>{ this.setState({showLoginGate:true, authOptimistic:false}); });\n  }\n  onLoginEmailChange(e){ this.setState({loginEmail:e.target.value}); }\n  onLoginPasswordChange(e){ this.setState({loginPassword:e.target.value}); }\n  onLoginSubmit(){\n    if(!this.supaClient) return;\n    this.setState({loginLoading:true, loginError:null});\n    this.supaClient.auth.signInWithPassword({ email:this.state.loginEmail, password:this.state.loginPassword })\n      .then(({data, error})=>{\n        if(error){ this.setState({loginLoading:false, loginError:error.message}); return; }\n        const user = data.user;\n        this.setState({authUser:user, showLoginGate:false, loginLoading:false, loginPassword:''});\n        this.sync.configure(this.supaClient, user.id);\n        this.sync.reconcileAll(this.state.data).then(()=>this.loadPersisted());\n      })\n      .catch((e)=>this.setState({loginLoading:false, loginError:'Não foi possível entrar. Tente novamente.'}));\n  }\n  onLogout(){\n    if(this.supaClient) this.supaClient.auth.signOut().catch(()=>{});\n    if(this.sync) this.sync.teardown();\n    this.setState({authUser:null, showLoginGate:true, authOptimistic:false});\n  }\n\n  // Tenta o arquivo externo audio_manifest.json (editável sem mexer no JS);\n  // se o fetch falhar (ex.: aberto via file://, sem servidor), cai no array\n  // embutido em content-data.js — nunca quebra por áudio ausente.\n  loadAudioManifest(contentMod){\n    fetch(window.__resources.audioManifestJson)\n      .then((r)=>{ if(!r.ok) throw new Error('status '+r.status); return r.json(); })\n      .then((json)=>{ this.setState({audioManifest: Array.isArray(json) && json.length ? json : contentMod.AUDIO_MANIFEST_FALLBACK}); })\n      .catch(()=>{ this.setState({audioManifest: contentMod.AUDIO_MANIFEST_FALLBACK}); });\n  }\n  findManifestExplanation(moduleId){\n    return (this.state.audioManifest||[]).find((e)=>e.module===moduleId && e.type==='explanation') || null;\n  }\n\n  // Toda leitura/escrita do app passa por readLS/writeLS, que delegam para store.js\n  // (hoje localStorage; na Fase 2 vira Supabase sem mudar mais nada além desse arquivo).\n  readLS(key, fallback){ return this.storage ? this.storage.get(key, fallback) : fallback; }\n  writeLS(key, value){ if(this.storage) this.storage.set(key, value); }\n\n  // Única exceção documentada à regra \"tudo passa por store.js\": esta função lê/escreve\n  // localStorage diretamente porque é uma migração de um formato de dados ANTERIOR ao\n  // próprio store.js (o antigo array toolkit_error_log). Não precisa mudar na Fase 2.\n  migrateLegacy(){\n    try{\n      const rawOldErr = localStorage.getItem('toolkit_error_log');\n      if(rawOldErr && !localStorage.getItem('toolkit_revisions')){\n        const oldErr = JSON.parse(rawOldErr);\n        if(Array.isArray(oldErr) && oldErr.length){\n          const revisions = {};\n          oldErr.forEach((e)=>{\n            const c = e.type || 'geral';\n            if(!revisions[c]) revisions[c] = {concept:c, given:e.given, correctAnswer:e.correct, explanation:e.explanation, count:0, updatedAt:Date.now()};\n            revisions[c].count++; revisions[c].given=e.given; revisions[c].correctAnswer=e.correct; revisions[c].explanation=e.explanation;\n          });\n          this.storage.set('revisions', revisions);\n        }\n      }\n      localStorage.removeItem('toolkit_error_log');\n      localStorage.removeItem('toolkit_wh_checked');\n    }catch(e){}\n  }\n\n  loadPersisted(){\n    this.setState({\n      theme: this.readLS('theme','light'),\n      understood: this.readLS('understood',{}),\n      myExplanations: this.readLS('my_explanations',{}),\n      interviewAnswers: this.readLS('interview_answers',{}),\n      printSelected: this.readLS('printables_selected',['f1','f2','f3','f4']),\n      lastSection: this.readLS('last_section', null),\n      topicActivity: this.readLS('topic_activity', {}),\n      streaks: this.readLS('streaks', {correct:{}, wrong:{}}),\n      revisions: this.readLS('revisions', {})\n    });\n  }\n\n  setView(v){\n    this.setState({view:v});\n    if(v!=='home'){ this.writeLS('last_section', v); this.setState({lastSection:v}); }\n  }\n\n  openTopic(t){\n    if(t.kind==='practice'){ this.setState((s)=>({fundamentosExpand:{...s.fundamentosExpand, [t.practiceId]:true}})); this.setView('fundamentos'); }\n    else if(t.kind==='duvidas') this.setView('duvidas');\n    else if(t.kind==='whwords') this.setView('whwords');\n    else if(t.kind==='interview') this.setView('interviews');\n  }\n\n  toggleTheme(){\n    this.setState((s)=>{ const t = s.theme==='light'?'dark':'light'; this.writeLS('theme', t); return {theme:t}; });\n  }\n\n  speak(text, lang, rate){\n    if(!('speechSynthesis' in window)){ this.setState({speechUnsupported:true}); setTimeout(()=>this.setState({speechUnsupported:false}), 4000); return; }\n    try{\n      window.speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = lang; u.rate = rate || 1;\n      window.speechSynthesis.speak(u);\n    }catch(e){ this.setState({speechUnsupported:true}); }\n  }\n\n  startRepeatFlow(id, text){\n    const voice = (this.props && this.props.englishVoice) || 'en-US';\n    this.speak(text, voice, 1);\n    this.setState({repeatFlow:{id, phase:'Tocando a frase...'}});\n    setTimeout(()=>{\n      this.setState((s)=> s.repeatFlow && s.repeatFlow.id===id ? {repeatFlow:{id, phase:'Sua vez! Repita em voz alta.'}} : {});\n      setTimeout(()=>{\n        this.speak(text, voice, 1);\n        this.setState((s)=> s.repeatFlow && s.repeatFlow.id===id ? {repeatFlow:{id, phase:'Pronto — clique em \"Escute e repita\" para repetir.'}} : {});\n      }, 3000);\n    }, 900);\n  }\n\n  toggleExpand(id){\n    this.setState((s)=>({ duvidasUI:{...s.duvidasUI, [id]:{...(s.duvidasUI[id]||{}), expanded: !(s.duvidasUI[id]||{}).expanded} } }));\n  }\n  toggleChip(scope, id, idx){\n    const key = scope==='duvida' ? 'duvidasUI' : (scope==='lab' ? 'labUI' : 'auxUI');\n    this.setState((s)=>{\n      const cur = s[key][id] || {};\n      return { [key]: {...s[key], [id]: {...cur, activeChip: cur.activeChip===idx ? null : idx} } };\n    });\n  }\n  markUnderstood(id){\n    this.setState((s)=>{ const u = {...s.understood, [id]: !s.understood[id]}; this.writeLS('understood', u); return {understood:u}; });\n  }\n  cycleAlt(id, topic){\n    this.setState((s)=>{\n      const cur = s.duvidasUI[id]||{};\n      const list = (this.state.data && this.state.data.ALT_EXPLANATIONS[topic]) || [];\n      const total = Math.max(list.length,1);\n      const next = ((cur.altIndex==null? -1: cur.altIndex)+1) % total;\n      return { duvidasUI: {...s.duvidasUI, [id]: {...cur, altIndex:next} } };\n    });\n  }\n  setMyExplanation(id, text){\n    this.setState((s)=>{ const m = {...s.myExplanations,[id]:text}; this.writeLS('my_explanations', m); return {myExplanations:m}; });\n  }\n  normalize(s){ return (s||'').toLowerCase().replace(/[.?!]/g,'').replace(/\\s+/g,' ').trim(); }\n\n  // ---------- Motor único de exercícios + revisões (Requisitos 1 e 2) ----------\n  setExerciseInput(key, val){\n    this.setState((s)=>({ exerciseInputs:{...s.exerciseInputs,[key]:val}, exerciseChecked:{...s.exerciseChecked,[key]:false} }));\n  }\n  buildExercise(concept, activityId, prompt, correctAnswer, explanation){\n    const key = concept+':'+activityId;\n    const value = this.state.exerciseInputs[key] || '';\n    const checked = !!this.state.exerciseChecked[key];\n    const correct = checked && this.normalize(value)===this.normalize(correctAnswer);\n    const incorrect = checked && !correct;\n    const pending = !!this.state.pendingReview[key];\n    return {\n      prompt, value, correctAnswer, checked, correct, incorrect,\n      needsChoice: incorrect && pending,\n      autoLogged: incorrect && !pending,\n      onChange:(e)=>this.setExerciseInput(key, e.target.value),\n      onCheck:()=>this.checkUnified(concept, activityId, key, value, correctAnswer, explanation),\n      onDistraction:()=>this.resolveDistraction(concept, key),\n      onNeedsReview:()=>this.resolveNeedsReview(concept, key, value, correctAnswer, explanation)\n    };\n  }\n  // Só conta para o progresso do tópico se a atividade estiver na lista de essenciais\n  // (ESSENTIAL_ACTIVITIES); do contrário só alimenta as revisões (ex.: bônus em Auxiliares).\n  checkUnified(concept, activityId, key, given, correctAnswer, explanation){\n    const ok = this.normalize(given)===this.normalize(correctAnswer);\n    const essential = (this.state.data && this.state.data.ESSENTIAL_ACTIVITIES[concept]) || [];\n    if(essential.includes(activityId)) this.updateTopicActivity(concept, activityId, true, ok);\n    const streaks = { correct:{...this.state.streaks.correct}, wrong:{...this.state.streaks.wrong} };\n    const pendingReview = {...this.state.pendingReview};\n    if(ok){\n      streaks.wrong[concept] = 0;\n      streaks.correct[concept] = (streaks.correct[concept]||0)+1;\n      if(this.state.revisions[concept] && streaks.correct[concept]>=3){\n        const revisions = {...this.state.revisions}; delete revisions[concept];\n        streaks.correct[concept] = 0;\n        this.writeLS('revisions', revisions);\n        this.setState({revisions});\n      }\n      pendingReview[key] = false;\n    } else {\n      streaks.correct[concept] = 0;\n      streaks.wrong[concept] = (streaks.wrong[concept]||0)+1;\n      if(this.state.revisions[concept] || streaks.wrong[concept]>=2){\n        this.logRevision(concept, given, correctAnswer, explanation);\n        streaks.wrong[concept] = 0;\n        pendingReview[key] = false;\n      } else {\n        pendingReview[key] = true;\n      }\n    }\n    this.writeLS('streaks', streaks);\n    this.setState((s)=>({ streaks, pendingReview, exerciseChecked:{...s.exerciseChecked,[key]:true} }));\n  }\n  resolveDistraction(concept, key){\n    const streaks = { correct:{...this.state.streaks.correct}, wrong:{...this.state.streaks.wrong, [concept]:0} };\n    this.writeLS('streaks', streaks);\n    this.setState((s)=>({ streaks, pendingReview:{...s.pendingReview,[key]:false} }));\n  }\n  resolveNeedsReview(concept, key, given, correctAnswer, explanation){\n    this.logRevision(concept, given, correctAnswer, explanation);\n    const streaks = { correct:{...this.state.streaks.correct}, wrong:{...this.state.streaks.wrong, [concept]:0} };\n    this.writeLS('streaks', streaks);\n    this.setState((s)=>({ streaks, pendingReview:{...s.pendingReview,[key]:false} }));\n  }\n  logRevision(concept, given, correctAnswer, explanation){\n    const revisions = {...this.state.revisions};\n    const prev = revisions[concept];\n    revisions[concept] = { concept, given, correctAnswer, explanation, count: prev?prev.count+1:1, updatedAt: Date.now() };\n    this.writeLS('revisions', revisions);\n    this.setState({revisions});\n  }\n  deleteRevision(concept){\n    const revisions = {...this.state.revisions}; delete revisions[concept];\n    this.writeLS('revisions', revisions);\n    this.setState({revisions});\n  }\n  askClearRevisions(){ this.setState({confirmClearRevisions:true}); }\n  cancelClearRevisions(){ this.setState({confirmClearRevisions:false}); }\n  confirmClearRevisionsNow(){\n    this.writeLS('revisions', {});\n    this.setState({revisions:{}, confirmClearRevisions:false});\n  }\n  updateTopicActivity(topicId, activityId, attempted, correct){\n    const topicActivity = {...this.state.topicActivity};\n    const cur = topicActivity[topicId] || {attempted:{}, correct:{}};\n    topicActivity[topicId] = { attempted:{...cur.attempted, [activityId]:attempted}, correct:{...cur.correct, [activityId]:correct} };\n    this.writeLS('topic_activity', topicActivity);\n    this.setState({topicActivity});\n  }\n  computeTopicStatus(topicId, data){\n    const essential = (data.ESSENTIAL_ACTIVITIES && data.ESSENTIAL_ACTIVITIES[topicId]) || [];\n    if(essential.length===0) return 'none';\n    const act = this.state.topicActivity[topicId] || {attempted:{}, correct:{}};\n    const attemptedCount = essential.filter((id)=>act.attempted[id]).length;\n    const correctCount = essential.filter((id)=>act.correct[id]).length;\n    if(attemptedCount===0) return 'none';\n    if(attemptedCount>=essential.length && (correctCount/essential.length)>=0.75) return 'mastered';\n    return 'review';\n  }\n  labelForConcept(concept, data){\n    const t = data.TOPICS.find((x)=>x.id===concept);\n    if(t) return t.label;\n    const extra = {modais:'Modais (Can/Could/Should/Would)', have:'Have / Has / Had', toing:'To + Verbo × Verbo-ing', grammarfoundations:'Fundamentos da frase'};\n    return extra[concept] || concept;\n  }\n  onInterviewAnswerChange(blockId, text){\n    this.setState((s)=>{\n      const a = {...s.interviewAnswers, [blockId]:text};\n      this.writeLS('interview_answers', a);\n      return {interviewAnswers:a};\n    });\n    this.updateTopicActivity('interview', 'iv'+blockId, text.trim().length>0, text.trim().length>10);\n  }\n\n  onPlayListening(id, transcript){\n    const voice = (this.props && this.props.englishVoice) || 'en-US';\n    this.speak(transcript, voice, 1);\n  }\n  onRevealListening(id){\n    this.setState((s)=>({ listeningRevealed:{...s.listeningRevealed, [id]: !s.listeningRevealed[id]} }));\n  }\n\n  async startRecording(id){\n    try{\n      const stream = await navigator.mediaDevices.getUserMedia({audio:true});\n      const mr = new MediaRecorder(stream);\n      this._chunks = [];\n      mr.ondataavailable = (e)=>this._chunks.push(e.data);\n      mr.onstop = ()=>{\n        const blob = new Blob(this._chunks, {type:'audio/webm'});\n        const url = URL.createObjectURL(blob);\n        stream.getTracks().forEach((t)=>t.stop());\n        this.setState((s)=>({ recordings:{...s.recordings, [id]:{status:'done', url}} }));\n      };\n      this._mr = mr; this._mrId = id;\n      mr.start();\n      this.setState((s)=>({ recordings:{...s.recordings, [id]:{status:'recording'}} }));\n    }catch(e){\n      this.setState((s)=>({ recordings:{...s.recordings, [id]:{status:'unavailable'}} }));\n    }\n  }\n  stopRecording(id){\n    if(this._mr && this._mr.state==='recording' && this._mrId===id) this._mr.stop();\n  }\n  onRecordClick(id){\n    const cur = (this.state.recordings[id]||{}).status;\n    if(cur==='recording') this.stopRecording(id); else this.startRecording(id);\n  }\n\n  setLabField(id, field, value){\n    this.setState((s)=>({ labUI:{...s.labUI, [id]:{...(s.labUI[id]||{}), [field]:value}} }));\n  }\n\n  isThird(subject){ return subject==='he'||subject==='she'; }\n  cap(w){ return w.charAt(0).toUpperCase()+w.slice(1); }\n  thirdPersonS(verb){\n    if(!verb) return verb;\n    if(/(ss|sh|ch|x|o)$/.test(verb)) return verb+'es';\n    if(/[^aeiou]y$/.test(verb)) return verb.slice(0,-1)+'ies';\n    return verb+'s';\n  }\n  computeDoSentence(sent, subject, tense){\n    const Subj = PRONOUNS[subject];\n    const third = this.isThird(subject);\n    const verb = sent.verb;\n    const past = sent.pastForm || (verb.endsWith('e') ? verb+'d' : verb+(verb?'ed':''));\n    const full = (sent.complement||'') + (sent.timeMarker||'');\n    const wh = sent.wh ? sent.wh+' ' : '';\n    if(tense==='presente'){\n      const aux = third ? 'does' : 'do';\n      const auxNeg = third ? \"doesn't\" : \"don't\";\n      const verbAff = third ? this.thirdPersonS(verb) : verb;\n      return {\n        afirmativa: `${Subj} ${verbAff}${full?' '+full:''}.`,\n        negativa: `${Subj} ${auxNeg} ${verb}${full?' '+full:''}.`,\n        pergunta: `${wh}${this.cap(aux)} ${subject==='i'?'I':subject} ${verb}${full?' '+full:''}?`\n      };\n    }\n    return {\n      afirmativa: `${Subj} ${past}${full?' '+full:''}.`,\n      negativa: `${Subj} didn't ${verb}${full?' '+full:''}.`,\n      pergunta: `${wh}Did ${subject==='i'?'I':subject} ${verb}${full?' '+full:''}?`\n    };\n  }\n  computeBeSentence(sent, subject, tense){\n    const Subj = PRONOUNS[subject];\n    const forms = { presente:{i:'am',he:'is',she:'is',you:'are',we:'are',they:'are'}, passado:{i:'was',he:'was',she:'was',you:'were',we:'were',they:'were'} };\n    const be = forms[tense][subject];\n    const negMap = { am:\"'m not\", is:\"isn't\", are:\"aren't\", was:\"wasn't\", were:\"weren't\" };\n    const full = (sent.complement||'') + (sent.timeMarker||'');\n    const subjLower = subject==='i' ? 'I' : subject;\n    if(subject==='i' && tense==='presente'){\n      return { afirmativa:`I'm ${full}.`, negativa:`I'm not ${full}.`, pergunta:`Am I ${full}?` };\n    }\n    return {\n      afirmativa: `${Subj} ${be} ${full}.`,\n      negativa: `${Subj} ${negMap[be]} ${full}.`,\n      pergunta: `${this.cap(be)} ${subjLower} ${full}?`\n    };\n  }\n  getComputedSentence(sent, subject, tense){\n    return sent.type==='be' ? this.computeBeSentence(sent, subject, tense) : this.computeDoSentence(sent, subject, tense);\n  }\n\n  togglePrintSelected(id){\n    this.setState((s)=>{\n      const cur = s.printSelected||[];\n      const next = cur.includes(id) ? cur.filter((x)=>x!==id) : [...cur, id];\n      this.writeLS('printables_selected', next);\n      return {printSelected:next};\n    });\n  }\n  doPrint(){\n    if(!this.state.printSelected || this.state.printSelected.length===0){ this.setState({printWarning:true}); return; }\n    this.setState({printWarning:false});\n    setTimeout(()=>window.print(), 60);\n  }\n\n  renderVals(){\n    try{ return this._renderVals(); }\n    catch(err){\n      console.error('English Toolkit renderVals crashed:', err && (err.stack || err.message || err));\n      return this._safeVals();\n    }\n  }\n\n  _safeVals(){\n    const theme = this.state.theme || 'light';\n    const view = this.state.view || 'home';\n    const navDefs = [\n      {id:'home', label:'Início'}, {id:'duvidas', label:'Dúvidas'}, {id:'fundamentos', label:'Fundamentos'}, {id:'lab', label:'Laboratório'},\n      {id:'auxiliares', label:'Auxiliares'}, {id:'whwords', label:'WH-words'},\n      {id:'interviews', label:'Entrevistas'}, {id:'printables', label:'Printables'}\n    ];\n    const navItems = navDefs.map((n)=>({\n      label:n.label, onClick:()=>this.setView(n.id),\n      style:`border:2px solid var(--ink);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;${view===n.id ? 'background:var(--vinho);color:#fff;box-shadow:2px 2px 0 var(--ink);' : 'background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--line);'}`\n    }));\n    return {\n      theme, themeIcon: theme==='light' ? '🌙' : '☀️', toggleTheme:()=>this.toggleTheme(),\n      isHome:false, isDuvidas:false, isFundamentos:false, isLab:false, isAux:false, isWh:false, isInterviews:false, isPrintables:false,\n      navItems, topicsView:[], masteredCount:0, homeCards:[],\n      revisionsView:[], hasRevisions:false, noRevisions:true, revisionCount:0, confirmClear:false, notConfirmClear:true,\n      onAskClear:()=>{}, onConfirmClear:()=>{}, onCancelClear:()=>{},\n      microlessonsView:[], fundamentosView:[], styleAudioBtn:'', styleAudioBtnSm:'',\n      labView:[], auxGroupsView:[], whWordsView:[], whWordsForPrint:[], interviewsView:[], printablesView:[],\n      printWarning:false, doPrint:()=>{}, speechUnsupported:false,\n      showLoginGate:false, showLogoutButton:false, loginEmail:'', loginPassword:'', loginError:null, loginButtonLabel:'Entrar',\n      onLoginEmailChange:()=>{}, onLoginPasswordChange:()=>{}, onLoginSubmit:()=>{}, onLogout:()=>{}\n    };\n  }\n\n  _renderVals(){\n    const data = this.state.data;\n    const theme = this.state.theme;\n    const view = this.state.view;\n\n    const navDefs = [\n      {id:'home', label:'Início'}, {id:'duvidas', label:'Dúvidas'}, {id:'fundamentos', label:'Fundamentos'}, {id:'lab', label:'Laboratório'},\n      {id:'auxiliares', label:'Auxiliares'}, {id:'whwords', label:'WH-words'},\n      {id:'interviews', label:'Entrevistas'}, {id:'printables', label:'Printables'}\n    ];\n    const navItems = navDefs.map((n)=>({\n      label:n.label, onClick:()=>this.setView(n.id),\n      style:`border:2px solid var(--ink);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;${view===n.id ? 'background:var(--vinho);color:#fff;box-shadow:2px 2px 0 var(--ink);' : 'background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--line);'}`\n    }));\n\n    let topicsView = [], masteredCount = 0;\n    if(data){\n      const labels = {mastered:'🟢 Dominado', review:'🟡 Em andamento', none:'⚪ Ainda não estudado'};\n      topicsView = data.TOPICS.map((t)=>{\n        const status = this.computeTopicStatus(t.id, data);\n        return {...t, status, statusLabel:labels[status], onClick:()=>this.openTopic(t)};\n      });\n      masteredCount = topicsView.filter((t)=>t.status==='mastered').length;\n    }\n\n    // ---- Revisões ----\n    let revisionsView = [];\n    if(data){\n      revisionsView = Object.values(this.state.revisions||{})\n        .sort((a,b)=>b.updatedAt-a.updatedAt)\n        .map((r)=>({ ...r, label:this.labelForConcept(r.concept, data), onDelete:()=>this.deleteRevision(r.concept) }));\n    }\n    const hasRevisions = revisionsView.length>0;\n\n    const sectionLabels = {duvidas:'Dúvidas que travaram você', fundamentos:'Fundamentos', lab:'Laboratório de Frases', auxiliares:'Auxiliares e Modais', whwords:'WH-words', interviews:'English for Interviews', printables:'Printables'};\n    const lastSection = this.state.lastSection;\n    const continueLabel = lastSection ? `Continuar em: ${sectionLabels[lastSection]}` : 'Começar pelas Dúvidas';\n    const cardBase = 'text-align:left;border:2.5px solid var(--ink);border-radius:14px;padding:20px;background:var(--card);cursor:pointer;box-shadow:4px 4px 0 var(--line);';\n    const cardFeatured = 'text-align:left;border:3px solid var(--vinho);border-radius:14px;padding:20px;background:var(--card);cursor:pointer;grid-column:1/-1;box-shadow:5px 5px 0 var(--vinho);';\n    const homeCards = [\n      {icon:'🧠', title:'Dúvidas gerais\\n', subtitle:'O núcleo do toolkitnão é gramática solta.', click:()=>this.setView('duvidas'), cardStyle:cardFeatured},\n      {icon:'📗', title:'Fundamentos', subtitle:'Cumprimentos, To Be, dados pessoais, small talk, likes.', click:()=>this.setView('fundamentos'), cardStyle:cardBase},\n      {icon:'🎯', title:'English for Interviews', subtitle:'Blocos prontos para entrevista.', click:()=>this.setView('interviews'), cardStyle:cardBase},\n      {icon:'🖨️', title:'Printables', subtitle:'Folhas para imprimir e colar na parede.', click:()=>this.setView('printables'), cardStyle:cardBase},\n      {icon:'🧩', title:'Montando a Frase', subtitle:'Desmonte e remonte frases reais.', click:()=>this.setView('lab'), cardStyle:cardBase},\n      {icon:'⚙️', title:'Auxiliares e Modais', subtitle:'Do/Does/Did, To Be, Modais, Have.', click:()=>this.setView('auxiliares'), cardStyle:cardBase},\n      {icon:'❓', title:'WH-words', subtitle:'What, Where, When, Who, Why, Which, Whose, How.', click:()=>this.setView('whwords'), cardStyle:cardBase},\n      {icon:'▶️', title:continueLabel, subtitle:'Volta para onde você parou.', click:()=>this.setView(lastSection||'duvidas'), cardStyle:cardBase}\n    ];\n\n    const styleAudioBtn = \"background:var(--periwinkle);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;box-shadow:2px 2px 0 var(--ink)\";\n    const styleAudioBtnSm = \"background:var(--card);border:2px solid var(--periwinkle);color:var(--periwinkle);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif\";\n    const chipStyle = (active)=>`display:inline-flex;flex-direction:column;padding:8px 13px;border-radius:8px;border:2px solid var(--ink);background:${active?'var(--cloud)':'var(--card)'};color:${active?'#1a1a1a':'var(--ink)'};cursor:pointer;font-size:13px;font-weight:700;font-family:'Manrope',sans-serif;box-shadow:${active?'2px 2px 0 var(--ink)':'none'}`;\n\n    // ---- Dúvidas ----\n    let microlessonsView = [];\n    if(data){\n      const altTopic = data.ALT_EXPLANATIONS;\n      microlessonsView = data.MICROLESSONS.map((l, i)=>{\n        const ui = this.state.duvidasUI[l.id] || {};\n        const alts = altTopic[l.topic] || [];\n        const currentAlt = ui.altIndex!=null ? alts[ui.altIndex % Math.max(alts.length,1)] : null;\n        const understood = !!this.state.understood[l.id];\n        const activeChip = ui.activeChip;\n        const brokenPieces = l.broken.map((pair, idx)=>({\n          word:pair[0], onClick:()=>this.toggleChip('duvida', l.id, idx), style:chipStyle(activeChip===idx)\n        }));\n        const activeRole = activeChip!=null ? l.broken[activeChip][1] : null;\n        const exampleSentence = l.transform.pergunta || l.broken.map((p)=>p[0]).join(' ');\n        const listening = l.listening ? {...l.listening} : null;\n        const recording = this.state.recordings[l.id] || {status:'idle'};\n        const recordLabel = recording.status==='recording' ? '⏹️ Parar gravação' : (recording.status==='done' ? '🎙️ Gravar novamente' : '🎙️ Grave sua versão');\n        return {\n          ...l, badge:`Dúvida ${i+1} —`,\n          expanded: !!ui.expanded, expandIcon: ui.expanded ? '▲' : '▼',\n          toggleExpand:()=>this.toggleExpand(l.id),\n          activeChip, activeRole, brokenPieces,\n          understood, understoodLabel: understood ? '✅ Entendido' : 'Agora entendi',\n          understoodBtnStyle: understood\n            ? 'background:#3F8F5F;color:#fff;border:2px solid var(--ink);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px;box-shadow:2px 2px 0 var(--ink)'\n            : 'background:var(--vinho);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px;box-shadow:2px 2px 0 var(--ink)',\n          toggleUnderstood:()=>this.markUnderstood(l.id),\n          hasAlt: alts.length>0, currentAlt, onCycleAlt:()=>this.cycleAlt(l.id, l.topic),\n          myExplanation: this.state.myExplanations[l.id] || '',\n          onMyExplanationChange:(e)=>this.setMyExplanation(l.id, e.target.value),\n          exercise: this.buildExercise(l.topic, l.id, l.mini.prompt, l.mini.answer, l.technical),\n          onPlayPt:()=>{ const m = this.findManifestExplanation(l.topic); this.speak(m ? m.transcript : l.shortAnswer, 'pt-BR', 1); },\n          onPlaySlow:()=>this.speak(l.broken.map((p)=>p[0]).join(', '), (this.props&&this.props.englishVoice)||'en-US', this.props&&this.props.slowRate || 0.7),\n          onPlayNatural:()=>this.speak(exampleSentence, (this.props&&this.props.englishVoice)||'en-US', 1),\n          repeatPhase: this.state.repeatFlow && this.state.repeatFlow.id===l.id ? this.state.repeatFlow.phase : null,\n          repeatPhaseLabel: this.state.repeatFlow && this.state.repeatFlow.id===l.id ? this.state.repeatFlow.phase : '',\n          onRepeatFlow:()=>this.startRepeatFlow(l.id, exampleSentence),\n          listening, listeningRevealed: !!this.state.listeningRevealed[l.id],\n          onPlayListening: listening ? ()=>this.speak(listening.transcript, 'en-US', 1) : null,\n          onRevealListening:()=>this.onRevealListening(l.id),\n          recording, recordLabel, recordingUnavailable: recording.status==='unavailable',\n          onRecordClick:()=>this.onRecordClick(l.id)\n        };\n      });\n    }\n\n    // ---- Fundamentos ----\n    let fundamentosView = [];\n    if(data){\n      const practiceIds = data.TOPICS.filter((t)=>t.kind==='practice').map((t)=>t.practiceId);\n      fundamentosView = practiceIds.map((pid)=>{\n        const pt = data.PRACTICE_TOPICS[pid];\n        const status = this.computeTopicStatus(pid, data);\n        const labels = {mastered:'🟢 Dominado', review:'🟡 Em andamento', none:'⚪ Não iniciado'};\n        const drillsView = pt.drills.map((d)=>({ ...d, exercise:this.buildExercise(pid, d.id, d.prompt, d.answer, d.explanation) }));\n        return {\n          id:pid, title:pt.title, intro:pt.intro, statusLabel:labels[status],\n          expanded: !!this.state.fundamentosExpand[pid], expandIcon: this.state.fundamentosExpand[pid] ? '▲' : '▼',\n          toggle:()=>this.setState((s)=>({fundamentosExpand:{...s.fundamentosExpand,[pid]: !s.fundamentosExpand[pid]}})),\n          drillsView\n        };\n      });\n    }\n\n    // ---- Lab ----\n    let labView = [];\n    if(data){\n      labView = data.LAB_SENTENCES.map((s)=>{\n        const uiRaw --ink);':'background:var(--card);color:var(--ink);'}`\n        }));\n        return {\n          ...s, currentSentence, piecesView, activeRole,\n          formOptions, tenseOptions, subjectOptions,\n          onPlay:()=>this.speak(currentSentence, (this.props&&this.props.englishVoice)||'en-US', 1),\n          showTranslation: !!ui.showTranslation,\n          translationToggleLabel: ui.showTranslation ? 'Ocultar tradução' : 'Mostrar tradução',\n          onToggleTranslation:()=>this.setLabField(s.id,'showTranslation', !ui.showTranslation),\n          translationText: ui.subject===s.subjectDefault ? s.translation : 'Tradução disponível para a frase base — troque de volta o sujeito para ver.'\n        };\n      });\n    }\n\n    // ---- Auxiliares ----\n    let auxGroupsView = [];\n    if(data){\n      auxGroupsView = data.AUX_GROUPS.map((g)=>{\n        const gui = this.state.auxUI[g.id] || {};\n        const concept = AUX_CONCEPT[g.id] || g.id;\n        const itemsView = g.items.map((item, idx)=>{\n          const activityId = 'aux-'+item.word.toLowerCase().replace(/[^a-z]/g,'').slice(0,12)+'-'+idx;\n          const hasExercise = !!item.mini;\n          return {\n            ...item, hasExercise,\n            exercise: hasExercise ? this.buildExercise(concept, activityId, item.mini.prompt, item.mini.answer, item.rule||item.func) : null,\n            onPlay:()=>this.speak(item.profExample||item.question||item.affirmative||item.word, (this.props&&this.props.englishVoice)||'en-US', 1)\n          };\n        });\n        return { ...g, expanded: !!gui.expanded, expandIcon: gui.expanded?'▲':'▼', toggle:()=>this.setState((s)=>({auxUI:{...s.auxUI,[g.id]:{...gui, expanded: !gui.expanded}}})), itemsView };\n      });\n    }\n\n    // ---- WH words ----\n    let whWordsView = [], whWordsForPrint = [];\n    let whHasAlt = false, whCurrentAlt = null;\n    if(data){\n      whWordsView = data.WH_WORDS.map((w)=>{\n        const blank = w.example.replace(new RegExp('^'+w.word), '___'
